
# Service : expose le Deployment posts à l'intérieur du cluster Kubernetes
apiVersion: v1             # Version de l'API Kubernetes
kind: Service              # Un Service fournit une adresse réseau stable pour accéder aux pods
metadata:
  name: posts-clusterip-srv  # Nom DNS du service (l'ingress redirige /posts/create vers ce service)
spec:
  type: ClusterIP          # ClusterIP : accessible uniquement depuis l'intérieur du cluster (pas d'accès externe direct)
  selector:
    app: posts             # Sélectionne les pods avec le label app=posts (ceux du Deployment posts)
  ports:
    - name: posts          # Nom du port
      protocol: TCP        # Protocole TCP
      port: 4000           # Port du service dans le cluster
      targetPort: 4000     # Port du conteneur Docker vers lequel le trafic est redirigé
